# OpenOCD 配置: CMSIS-DAP + STM32F103
# 适用于: rst-control-fw (STM32F103ZE)
# 调试器: CMSIS-DAP / DAPLink

# ========================================
# 调试器接口配置
# ========================================
source [find interface/cmsis-dap.cfg]

# 传输协议: SWD (Serial Wire Debug)
transport select swd

# SWD 时钟频率: 1000 kHz (1 MHz)
adapter speed 1000

# ========================================
# CMSIS-DAP 特定配置
# ========================================
# 如果需要指定 VID/PID，取消下面的注释并填入你的设备 ID
# cmsis_dap vid_pid 0x0d28 0x0204

# 如果有多个 CMSIS-DAP 设备，可以通过序列号选择
# cmsis_dap serial <YOUR_SERIAL_NUMBER>

# ========================================
# 目标芯片配置
# ========================================
set CHIPNAME stm32f1x
set WORKAREASIZE 0x5000

source [find target/stm32f1x.cfg]

# ========================================
# 复位配置
# ========================================
reset_config srst_only

# ========================================
# 调试辅助函数
# ========================================
proc halt_target {} {
    echo "Halting target..."
    halt
    sleep 100
}

proc reset_target {} {
    echo "Resetting target..."
    reset halt
    sleep 100
}

proc flash_program {filename} {
    echo "Programming flash: $filename"
    reset halt
    flash write_image erase $filename 0x08000000
    verify_image $filename 0x08000000
    reset run
    echo "Flash programming complete!"
}

# ========================================
# 启动时执行
# ========================================
$_TARGETNAME configure -event gdb-attach {
    echo "GDB attached"
    halt
}

$_TARGETNAME configure -event gdb-detach {
    echo "GDB detached"
    resume
}
