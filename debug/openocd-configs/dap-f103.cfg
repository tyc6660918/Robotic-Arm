# 野火 DAP 小智款 + STM32F103ZET6 (霸道开发板)
# 已验证: CMSIS-DAP FW 1.2.0, Serial# 6D656D6F7279
#
# 关键: 这个 DAP 是 CMSIS-DAP v1, 走 HID 传输, 必须显式指定 backend hid,
#       否则 OpenOCD 默认尝试 libusb(v2) 会报
#       "could not get configuration descriptor / hid_write failed"

adapter driver cmsis-dap
cmsis-dap backend hid
cmsis-dap vid_pid 0x0416 0x5021

transport select swd
adapter speed 1000

source [find target/stm32f1x.cfg]

reset_config srst_only srst_nogate connect_assert_srst
