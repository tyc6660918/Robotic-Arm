# OpenOCD 配置: WCH-Link + STM32F103
# 适用于: rst-control-fw (STM32F103ZE)
# 调试器: WCH-Link / WCH-LinkE

# ========================================
# 调试器接口配置
# ========================================
# WCH-Link 使用 CMSIS-DAP 协议
adapter driver cmsis-dap

# WCH-Link 的 VID/PID
# 常见值: 0x0416:0x5021 (根据实际设备可能不同)
cmsis_dap vid_pid 0x0416 0x5021

# 传输协议: SWD (Serial Wire Debug)
transport select swd

# SWD 时钟频率: 1000 kHz (1 MHz)
# WCH-Link 可能支持更高速度，根据实际情况调整
adapter speed 1000

# ========================================
# 目标芯片配置
# ========================================
set CHIPNAME stm32f1x
set WORKAREASIZE 0x5000

source [find target/stm32f1x.cfg]

# ========================================
# 复位配置
# ========================================
reset_config srst_only

# ========================================
# WCH-Link 特殊配置
# ========================================
# 如果连接不稳定，可以尝试降低速度
# adapter speed 500

# 如果需要特定的 USB 总线位置
# cmsis_dap usb location <bus>:<port>

# ========================================
# 调试辅助函数
# ========================================
proc halt_target {} {
    echo "Halting target..."
    halt
    sleep 100
}

proc reset_target {} {
    echo "Resetting target..."
    reset halt
    sleep 100
}

proc flash_program {filename} {
    echo "Programming flash: $filename"
    reset halt
    flash write_image erase $filename 0x08000000
    verify_image $filename 0x08000000
    reset run
    echo "Flash programming complete!"
}

# ========================================
# 启动时执行
# ========================================
$_TARGETNAME configure -event gdb-attach {
    echo "GDB attached"
    halt
}

$_TARGETNAME configure -event gdb-detach {
    echo "GDB detached"
    resume
}

# ========================================
# 故障排除提示
# ========================================
# 如果连接失败，请检查：
# 1. WCH 官方驱动是否已安装
# 2. 设备管理器中是否正确识别
# 3. 尝试使用 WCH-LinkUtility 测试连接
# 4. 确认 VID/PID 是否正确（用 lsusb 或设备管理器查看）
