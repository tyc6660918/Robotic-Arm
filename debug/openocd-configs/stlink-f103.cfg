# OpenOCD 配置: ST-Link + STM32F103
# 适用于: rst-control-fw (STM32F103ZE)
# 调试器: ST-Link V2/V2.1/V3

# ========================================
# 调试器接口配置
# ========================================
source [find interface/stlink.cfg]

# 传输协议: SWD (Serial Wire Debug)
transport select hla_swd

# SWD 时钟频率: 1800 kHz (1.8 MHz)
adapter speed 1800

# ========================================
# 目标芯片配置
# ========================================
source [find target/stm32f1x.cfg]

# ========================================
# 复位配置
# ========================================
reset_config srst_only srst_nogate

# ========================================
# 调试辅助函数
# ========================================
proc halt_target {} {
    echo "Halting target..."
    halt
    sleep 100
}

proc reset_target {} {
    echo "Resetting target..."
    reset halt
    sleep 100
}

proc flash_program {filename} {
    echo "Programming flash: $filename"
    reset halt
    flash write_image erase $filename 0x08000000
    verify_image $filename 0x08000000
    reset run
    echo "Flash programming complete!"
}

# ========================================
# 启动时执行
# ========================================
$_TARGETNAME configure -event gdb-attach {
    echo "GDB attached"
    halt
}

$_TARGETNAME configure -event gdb-detach {
    echo "GDB detached"
    resume
}
